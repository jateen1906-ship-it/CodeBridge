version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codebridge-postgres
    environment:
      POSTGRES_USER: codebridge_user
      POSTGRES_PASSWORD: codebridge_password
      POSTGRES_DB: codebridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: codebridge-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://codebridge_user:codebridge_password@postgres:5432/codebridge?sslmode=disable
    depends_on:
      - postgres

volumes:
  postgres_data:
